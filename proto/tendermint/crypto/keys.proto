syntax = "proto3";
package tendermint.crypto;

option go_package = "github.com/cometbft/cometbft/proto/tendermint/crypto";

import "gogoproto/gogo.proto";

// PublicKey defines the keys available for use with Validators
message PublicKey {
  option (gogoproto.compare) = true;
  option (gogoproto.equal)   = true;

  oneof sum {
    bytes ed25519   = 1;
    bytes secp256k1 = 2;
    // ADR-008 §F4: hybrid Ed25519 + ML-DSA-44 consensus pubkey.
    // Wire format: ed25519(32) || mldsa44(1312) = 1344 bytes.
    bytes aegis_hybrid_ed25519_mldsa44 = 3;
  }
}
